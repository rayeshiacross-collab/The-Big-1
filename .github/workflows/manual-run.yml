name: Manual Doctor
on:
  workflow_dispatch:
    inputs:
      command:
        description: Local model doctor only; claims require persistent local storage
        type: choice
        options: [doctor]
        default: doctor
        required: true
permissions:
  contents: read
concurrency:
  group: hub-local-doctor
  cancel-in-progress: false
jobs:
  doctor:
    # Opt-in local runner: model remains loopback-only. Never expose Ollama publicly.
    runs-on: [self-hosted, hub-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Doctor
        env:
          HUB_COMMAND: ${{ inputs.command }}
          ALLOW_PAID_APIS: '0'
        run: |
          case "$HUB_COMMAND" in
            doctor) python -m src.runner doctor ;;
            *) echo 'Unsupported command' >&2; exit 2 ;;
          esac
